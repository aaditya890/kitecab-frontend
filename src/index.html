    <!-- Google tag (gtag.js) -->
    <!-- ✅ Google tag (gtag.js) – single loader for both GA4 + Ads -->
    <!-- IDs, config and events are unchanged. Only the two Google script files are fetched
       after the first scroll/tap/key or 3.5 s (whichever is first), so they don't slow the
       first screen. Everything sent before that waits in dataLayer and is delivered. -->
    <script>
      window.kcLoadTag = function (src) {
        var go = function () {
          if (go.done) return;
          go.done = true;
          var j = document.createElement('script');
          j.async = true;
          j.src = src;
          document.head.appendChild(j);
        };
        ['scroll', 'pointerdown', 'keydown', 'touchstart'].forEach(function (e) {
          addEventListener(e, go, { once: true, passive: true });
        });
        addEventListener('load', function () {
          setTimeout(go, 3500);
        });
      };
      kcLoadTag('https://www.googletagmanager.com/gtag/js?id=G-F0DRP723DL');
    </script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      // Google Ads
      gtag('config', 'AW-17814447196');

      // GA4
      gtag('config', 'G-T836ZN3ZW3');
    </script>

    <!-- Google Tag Manager -->
    <script>

        var dl = l != 'dataLayer' ? '&l=' + l : '';
        w.kcLoadTag('https://www.googletagmanager.com/gtm.js?id=' + i + dl);
